
name: Generate Fling Wand Icon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icon:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Generate pixel-art PNG
        run: |
          python3 - <<'PY'
          import os
          import struct
          import zlib

          size = 32
          pixels = [[(0, 0, 0, 0) for x in range(size)]
                    for y in range(size)]

          def put(x, y, color):
              if 0 <= x < size and 0 <= y < size:
                  pixels[y][x] = color

          GOLD = (255, 190, 35, 255)
          LIGHT = (255, 235, 100, 255)
          DARK = (130, 75, 20, 255)
          CYAN = (0, 220, 255, 255)
          WHITE = (235, 255, 255, 255)

          # Diagonal golden wand handle
          for i in range(5, 27):
              x = i
              y = 30 - i
              put(x - 1, y, DARK)
              put(x, y, GOLD)
              put(x, y - 1, LIGHT)
              put(x + 1, y, GOLD)

          # Cyan crystal at the tip
          for x, y in [
              (24, 3), (25, 3), (26, 3),
              (23, 4), (24, 4), (25, 4), (26, 4), (27, 4),
              (23, 5), (24, 5), (25, 5), (26, 5), (27, 5),
              (24, 6), (25, 6), (26, 6),
              (25, 7)
          ]:
              put(x, y, CYAN)

          put(25, 4, WHITE)
          put(24, 5, WHITE)

          # Magical sparkles
          for x, y in [
              (19, 2), (20, 2), (19, 3),
              (29, 6), (28, 6), (29, 7),
              (21, 10), (22, 10), (21, 9)
          ]:
              put(x, y, CYAN)

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          raw = b"".join(
              b"\x00" + b"".join(bytes(pixel) for pixel in row)
              for row in pixels
          )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(
                  ">IIBBBBB", size, size, 8, 6, 0, 0, 0
              ))
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          output = "FlingMobs_RP/textures/items/fling_wand.png"
          os.makedirs(os.path.dirname(output), exist_ok=True)

          with open(output, "wb") as f:
              f.write(png)

          print(f"Generated {output} ({len(png)} bytes)")
          PY

      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FlingMobs_RP/textures/items/fling_wand.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "Generate Fling Wand pixel-art icon"
            git push
          fi
